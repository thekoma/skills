# Provenance manifest for every skill this repo tracks.
#
# Derived from ~/.agents/.skill-lock.json (written by `npx skills`, the
# vercel-labs/skills installer). Field names are kept identical to that
# lockfile — source, sourceType, sourceUrl, skillPath, skillFolderHash — so
# the two can be diffed without a translation layer.
#
# `ref` is a PINNED commit. Nothing upstream reaches a consumer until that ref
# is bumped, and bumping it is a reviewed pull request. See README.md.

